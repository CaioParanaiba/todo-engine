# Publica o modo demonstração (a pasta web/) no GitHub Pages a cada push na main que mexa na página.
# Endereço: https://caioparanaiba.github.io/todo-engine/  (Settings → Pages → Source: "GitHub Actions", uma vez só)
name: Demonstração no GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:   # botão "Run workflow" na aba Actions, para publicar à mão

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
